<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://login.microsoftonline.com https://graph.microsoft.com; object-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <meta
      name="description"
      content="在浏览器本地读取最新的 iCloud 或 Outlook 邮件。"
    />
    <title>Mail Reader</title>
    <link rel="icon" href="assets/mail.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <header class="masthead">
        <a class="brand" href="./" aria-label="Mail Reader 首页">
          <span class="brand-mark" aria-hidden="true">
            <img src="assets/mail.svg" alt="" width="24" height="24" />
          </span>
          <span>Mail Reader</span>
        </a>
        <a
          class="source-link"
          href="https://github.com/beyondcy1013/icloud-mail-reader"
          rel="noreferrer"
        >
          查看源码
        </a>
      </header>

      <section class="workspace" aria-label="邮件账户与凭据">
        <div class="intro">
          <p>自动识别 iCloud 和 Outlook，凭据仅在当前浏览器中处理。</p>
        </div>

        <div class="account-layout">
          <aside class="saved-panel" aria-labelledby="saved-title">
            <div class="saved-heading">
              <h2 id="saved-title">已保存账户</h2>
              <span id="saved-count" aria-live="polite">0</span>
            </div>
            <div
              id="saved-accounts"
              role="listbox"
              tabindex="0"
              aria-label="选择已保存账户"
              aria-describedby="saved-hint"
            ></div>
            <p id="saved-hint" class="sr-only">双击、按 Enter 或使用切换按钮载入账户。</p>
            <div class="saved-actions">
              <button id="switch-account" class="secondary-action" type="button" disabled>
                <img src="assets/switch.svg" alt="" width="17" height="17" />
                <span>切换</span>
              </button>
              <button id="delete-account" class="secondary-action danger-action" type="button" disabled>
                <img src="assets/trash.svg" alt="" width="17" height="17" />
                <span>删除</span>
              </button>
              <button id="clear-accounts" class="secondary-action danger-action clear-action" type="button" disabled>
                <img src="assets/trash.svg" alt="" width="17" height="17" />
                <span>清空全部</span>
              </button>
            </div>
          </aside>

          <form id="reader-form" class="reader-form" autocomplete="off" novalidate>
            <div class="field">
              <label id="mailbox-label" for="mailbox-address">邮箱地址</label>
              <input
                id="mailbox-address"
                name="mailbox-address"
                type="email"
                inputmode="email"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="name@icloud.com 或 name@outlook.com"
                aria-describedby="email-error"
                required
              />
              <p id="email-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="field">
              <label id="access-label" for="viewer-access">邮箱凭据</label>
              <input
                id="viewer-access"
                name="viewer-access"
                type="password"
                autocomplete="new-password"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                data-lpignore="true"
                data-1p-ignore="true"
                data-form-type="other"
                placeholder="输入 Token"
                aria-describedby="token-error token-note"
                required
              />
              <p id="token-error" class="field-error" aria-live="polite"></p>
              <p id="token-note" class="field-note">保存后会写入当前浏览器，仅限可信设备使用。</p>
            </div>

            <div id="client-id-field" class="field" hidden>
              <label for="client-id">Client ID</label>
              <input
                id="client-id"
                name="client-id"
                type="text"
                autocomplete="off"
                autocapitalize="none"
                autocorrect="off"
                spellcheck="false"
                placeholder="Microsoft 应用 Client ID"
                aria-describedby="client-id-error"
              />
              <p id="client-id-error" class="field-error" aria-live="polite"></p>
            </div>

            <div class="preferences">
              <label class="check-row" for="show-access">
                <input id="show-access" type="checkbox" />
                <span>显示凭据</span>
              </label>
              <label class="check-row" for="remember-mailbox">
                <input id="remember-mailbox" type="checkbox" checked />
                <span>保存账户凭据</span>
              </label>
            </div>

            <button class="primary-action" type="submit">
              <span id="submit-label">打开最新邮件</span>
              <img src="assets/external-link.svg" alt="" width="19" height="19" />
            </button>

            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>

            <section id="message-result" class="message-result" aria-labelledby="message-title" hidden>
              <div class="result-heading">
                <p>最新邮件</p>
                <time id="message-date"></time>
              </div>
              <h2 id="message-title"></h2>
              <p id="message-sender" class="message-sender"></p>
              <div id="message-codes" class="message-codes"></div>
              <p id="message-preview" class="message-preview"></p>
            </section>
          </form>
        </div>
      </section>

      <footer>
        <p>页面不会代理或保存邮件内容。iCloud 仅访问固定查看服务，Outlook 仅访问微软官方登录与 Graph API；本地保存的凭据请勿分享。</p>
      </footer>
    </main>
  </body>
</html>
