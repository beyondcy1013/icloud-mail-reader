[package]
name = "icloud-mail-reader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Read a token-protected iCloud mailbox viewer and extract login codes"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"

